<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理面板 - QQ Bot</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/light.css" id="theme-style">
    <style>
        .admin-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .admin-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid var(--border-color);
        }
        .admin-card h3 {
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .toggle-switch {
            position: relative;
            width: 50px;
            height: 26px;
        }
        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: 0.3s;
            border-radius: 26px;
        }
        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: 0.3s;
            border-radius: 50%;
        }
        .toggle-switch input:checked + .toggle-slider {
            background-color: var(--primary-color);
        }
        .toggle-switch input:checked + .toggle-slider:before {
            transform: translateX(24px);
        }
        .setting-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-color);
        }
        .setting-item:last-child {
            border-bottom: none;
        }
        .group-list {
            max-height: 300px;
            overflow-y: auto;
        }
        .group-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 8px;
            background: var(--input-bg);
        }
        .group-item:hover {
            background: var(--primary-color);
            color: white;
        }
        .log-area {
            background: var(--input-bg);
            border-radius: 8px;
            padding: 15px;
            font-family: monospace;
            font-size: 0.85em;
            max-height: 250px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🛡️ 管理面板</h1>
            <nav>
                <a href="home.html">首页</a>
                <a href="visitor_view.html">实时统计</a>
                <a href="admin.html" class="active">管理面板</a>
                <a href="#" onclick="logout()">退出</a>
                <button id="theme-toggle" onclick="toggleTheme()">🌙</button>
            </nav>
        </header>
        
        <main>
            <section class="stats-grid">
                <div class="stat-card">
                    <div class="number" id="total-groups">-</div>
                    <div class="label">管理群数</div>
                </div>
                <div class="stat-card">
                    <div class="number" id="total-users">-</div>
                    <div class="label">用户总数</div>
                </div>
                <div class="stat-card">
                    <div class="number" id="today-messages">-</div>
                    <div class="label">今日消息</div>
                </div>
                <div class="stat-card">
                    <div class="number" id="active-plugins">-</div>
                    <div class="label">活跃插件</div>
                </div>
            </section>
            
            <div class="admin-grid">
                <!-- 全局设置 -->
                <div class="admin-card">
                    <h3>⚙️ 全局设置</h3>
                    <div class="setting-item">
                        <span>机器人开关</span>
                        <label class="toggle-switch">
                            <input type="checkbox" id="bot-enabled" onchange="updateGlobalSetting('enabled', this.checked)">
                            <span class="toggle-slider"></span>
                        </label>
                    </div>
                    <div class="setting-item">
                        <span>AI 功能</span>
                        <label class="toggle-switch">
                            <input type="checkbox" id="ai-enabled" onchange="updateGlobalSetting('ai_enabled', this.checked)">
                            <span class="toggle-slider"></span>
                        </label>
                    </div>
                    <div class="setting-item">
                        <span>调试模式</span>
                        <label class="toggle-switch">
                            <input type="checkbox" id="debug-mode" onchange="updateGlobalSetting('debug', this.checked)">
                            <span class="toggle-slider"></span>
                        </label>
                    </div>
                </div>
                
                <!-- 群列表 -->
                <div class="admin-card">
                    <h3>👥 群列表</h3>
                    <div class="group-list" id="group-list">
                        <p style="opacity: 0.6;">加载中...</p>
                    </div>
                </div>
                
                <!-- 快捷操作 -->
                <div class="admin-card">
                    <h3>🚀 快捷操作</h3>
                    <div style="display: flex; flex-direction: column; gap: 10px;">
                        <button class="btn btn-primary" onclick="broadcastMessage()">📢 全群广播</button>
                        <button class="btn" onclick="refreshPlugins()">🔄 重载插件</button>
                        <button class="btn" onclick="clearCache()">🗑️ 清理缓存</button>
                        <button class="btn" style="background: #dc3545; color: white;" onclick="emergencyStop()">⚠️ 紧急停止</button>
                    </div>
                </div>
                
                <!-- 实时日志 -->
                <div class="admin-card" style="grid-column: span 2;">
                    <h3>📜 实时日志</h3>
                    <div class="log-area" id="log-area">
                        <p>等待连接...</p>
                    </div>
                </div>
            </div>
        </main>
        
        <footer>
            <p>QQ Bot &copy; 2026</p>
        </footer>
    </div>
    
    <!-- 广播弹窗 -->
    <div id="broadcast-modal" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1000;">
        <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: var(--card-bg); padding: 30px; border-radius: 12px; width: 90%; max-width: 500px;">
            <h3>📢 全群广播</h3>
            <textarea id="broadcast-text" style="width: 100%; height: 150px; margin: 15px 0; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--input-bg); color: var(--text-color); resize: vertical;" placeholder="输入广播内容..."></textarea>
            <div style="display: flex; gap: 10px; justify-content: flex-end;">
                <button class="btn" onclick="closeBroadcastModal()">取消</button>
                <button class="btn btn-primary" onclick="sendBroadcast()">发送</button>
            </div>
        </div>
    </div>
    
    <script>
        const token = localStorage.getItem('token');
        
        // 检查登录状态
        if (!token) {
            window.location.href = 'a_login.html';
        }
        
        function toggleTheme() {
            const link = document.getElementById('theme-style');
            const btn = document.getElementById('theme-toggle');
            if (link.href.includes('light.css')) {
                link.href = 'css/dark.css';
                btn.textContent = '☀️';
                localStorage.setItem('theme', 'dark');
            } else {
                link.href = 'css/light.css';
                btn.textContent = '🌙';
                localStorage.setItem('theme', 'light');
            }
        }
        
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') {
            document.getElementById('theme-style').href = 'css/dark.css';
            document.getElementById('theme-toggle').textContent = '☀️';
        }
        
        function logout() {
            localStorage.removeItem('token');
            window.location.href = 'a_login.html';
        }
        
        async function authFetch(url, options = {}) {
            options.headers = options.headers || {};
            options.headers['Authorization'] = 'Bearer ' + token;
            const resp = await fetch(url, options);
            if (resp.status === 401) {
                logout();
                return null;
            }
            return resp.json();
        }
        
        // 加载管理数据
        async function loadAdminData() {
            const data = await authFetch('/api/admin/dashboard');
            if (!data) return;
            
            document.getElementById('total-groups').textContent = data.total_groups;
            document.getElementById('total-users').textContent = data.total_users;
            document.getElementById('today-messages').textContent = data.today_messages;
            document.getElementById('active-plugins').textContent = data.active_plugins;
            
            document.getElementById('bot-enabled').checked = data.settings.enabled;
            document.getElementById('ai-enabled').checked = data.settings.ai_enabled;
            document.getElementById('debug-mode').checked = data.settings.debug;
            
            // 群列表
            const groupList = document.getElementById('group-list');
            if (data.groups && data.groups.length > 0) {
                groupList.innerHTML = data.groups.map(g => `
                    <div class="group-item" onclick="window.location.href='groups.html?id=${g.id}'">
                        <span>${g.name || g.id}</span>
                        <span style="opacity: 0.6;">${g.member_count} 人</span>
                    </div>
                `).join('');
            } else {
                groupList.innerHTML = '<p style="opacity: 0.6;">暂无群组</p>';
            }
        }
        
        async function updateGlobalSetting(key, value) {
            await authFetch('/api/admin/settings', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ [key]: value })
            });
        }
        
        function broadcastMessage() {
            document.getElementById('broadcast-modal').style.display = 'block';
        }
        
        function closeBroadcastModal() {
            document.getElementById('broadcast-modal').style.display = 'none';
        }
        
        async function sendBroadcast() {
            const text = document.getElementById('broadcast-text').value.trim();
            if (!text) return;
            
            const result = await authFetch('/api/admin/broadcast', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: text })
            });
            
            if (result && result.success) {
                alert('广播已发送到 ' + result.sent_count + ' 个群');
                closeBroadcastModal();
            }
        }
        
        async function refreshPlugins() {
            const result = await authFetch('/api/admin/plugins/reload', { method: 'POST' });
            if (result && result.success) {
                alert('插件已重载');
                loadAdminData();
            }
        }
        
        async function clearCache() {
            const result = await authFetch('/api/admin/cache/clear', { method: 'POST' });
            if (result && result.success) {
                alert('缓存已清理');
            }
        }
        
        async function emergencyStop() {
            if (!confirm('确定要紧急停止机器人吗？这将停止所有功能！')) return;
            await authFetch('/api/admin/emergency-stop', { method: 'POST' });
            alert('机器人已停止');
        }
        
        // SSE 日志
        function connectLogStream() {
            const logArea = document.getElementById('log-area');
            const es = new EventSource('/api/stats/stream');
            
            logArea.innerHTML = '<p style="color: var(--primary-color);">✓ 已连接</p>';
            
            es.onmessage = function(e) {
                const time = new Date().toLocaleTimeString();
                const line = document.createElement('div');
                line.textContent = `[${time}] ${e.data}`;
                logArea.insertBefore(line, logArea.firstChild.nextSibling);
                
                while (logArea.children.length > 50) {
                    logArea.removeChild(logArea.lastChild);
                }
            };
            
            es.onerror = function() {
                logArea.innerHTML = '<p style="color: #dc3545;">连接断开，5秒后重连...</p>' + logArea.innerHTML;
                setTimeout(connectLogStream, 5000);
            };
        }
        
        loadAdminData();
        connectLogStream();
    </script>
</body>
</html>
