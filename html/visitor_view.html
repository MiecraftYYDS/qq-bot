<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实时统计 - QQ Bot</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/light.css" id="theme-style">
</head>
<body>
    <div class="container">
        <header>
            <h1>📊 实时统计</h1>
            <nav>
                <a href="home.html">首页</a>
                <a href="visitor_view.html" class="active">实时统计</a>
                <a href="g_loginmode.html">群管登录</a>
                <a href="a_login.html">管理员</a>
                <button id="theme-toggle" onclick="toggleTheme()">🌙</button>
            </nav>
        </header>
        
        <main>
            <section class="stats-grid">
                <div class="stat-card">
                    <div class="number" id="total-messages">0</div>
                    <div class="label">消息总数</div>
                </div>
                
                <div class="stat-card">
                    <div class="number" id="total-commands">0</div>
                    <div class="label">命令执行</div>
                </div>
                
                <div class="stat-card">
                    <div class="number" id="total-ai">0</div>
                    <div class="label">AI 调用</div>
                </div>
                
                <div class="stat-card">
                    <div class="number" id="uptime">-</div>
                    <div class="label">运行时间</div>
                </div>
            </section>
            
            <section class="status" style="margin-top: 30px;">
                <h3>📡 实时连接状态</h3>
                <div id="event-status" style="padding: 15px; background: var(--input-bg); border-radius: 8px; margin-top: 15px;">
                    <p>等待连接...</p>
                </div>
            </section>
        </main>
        
        <footer>
            <p>QQ Bot &copy; 2026</p>
        </footer>
    </div>
    
    <script>
        // 主题切换
        function toggleTheme() {
            const link = document.getElementById('theme-style');
            const btn = document.getElementById('theme-toggle');
            if (link.href.includes('light.css')) {
                link.href = 'css/dark.css';
                btn.textContent = '☀️';
                localStorage.setItem('theme', 'dark');
            } else {
                link.href = 'css/light.css';
                btn.textContent = '🌙';
                localStorage.setItem('theme', 'light');
            }
        }
        
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') {
            document.getElementById('theme-style').href = 'css/dark.css';
            document.getElementById('theme-toggle').textContent = '☀️';
        }
        
        // 加载初始数据
        async function loadInitialStats() {
            try {
                const resp = await fetch('/api/stats/init');
                const data = await resp.json();
                
                document.getElementById('total-messages').textContent = data.total_messages.toLocaleString();
                document.getElementById('total-commands').textContent = data.total_commands.toLocaleString();
                document.getElementById('total-ai').textContent = data.total_ai_calls.toLocaleString();
                
                updateUptime(data.start_time);
                
                // 启动 SSE
                startEventStream();
            } catch (e) {
                console.error('加载失败:', e);
            }
        }
        
        function updateUptime(startTime) {
            function update() {
                const uptime = Date.now() - (startTime * 1000);
                const days = Math.floor(uptime / (1000 * 60 * 60 * 24));
                const hours = Math.floor((uptime % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const mins = Math.floor((uptime % (1000 * 60 * 60)) / (1000 * 60));
                document.getElementById('uptime').textContent = `${days}天${hours}时${mins}分`;
            }
            update();
            setInterval(update, 60000);
        }
        
        // SSE 事件流
        let eventSource = null;
        
        function startEventStream() {
            const statusBox = document.getElementById('event-status');
            statusBox.innerHTML = '<p style="color: var(--primary-color);">✓ 已连接</p>';
            
            eventSource = new EventSource('/api/stats/stream');
            
            eventSource.onmessage = function(e) {
                try {
                    const data = JSON.parse(e.data);
                    if (data.type === 'recv') {
                        const current = parseInt(document.getElementById('total-messages').textContent.replace(/,/g, ''));
                        document.getElementById('total-messages').textContent = (current + 1).toLocaleString();
                    }
                } catch (_) {
                    // 不展示事件细节，保护隐私
                }
            };
            
            eventSource.onerror = function() {
                statusBox.innerHTML = '<p style="color: #dc3545;">✗ 连接断开，正在重连...</p>';
                setTimeout(startEventStream, 5000);
            };
        }
        
        loadInitialStats();
    </script>
</body>
</html>
