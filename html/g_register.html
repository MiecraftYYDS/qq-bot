<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册账号 - QQ Bot</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/light.css" id="theme-style">
    <style>
        .verify-code {
            font-size: 3rem;
            font-weight: bold;
            letter-spacing: 1rem;
            text-align: center;
            padding: 30px;
            background: var(--card-bg);
            border: 2px dashed var(--primary-color);
            border-radius: 12px;
            margin: 30px 0;
            user-select: all;
            color: var(--primary-color);
        }
        .waiting-indicator {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
            padding: 15px;
            background: var(--input-bg);
            border-radius: 8px;
        }
        .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid var(--border-color);
            border-top-color: var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .step-indicator {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 30px;
        }
        .step {
            display: flex;
            align-items: center;
            gap: 8px;
            opacity: 0.5;
        }
        .step.active {
            opacity: 1;
        }
        .step-num {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        .step.active .step-num {
            background: var(--primary-color);
            color: white;
        }
        .countdown {
            font-size: 0.9em;
            opacity: 0.7;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📝 注册账号</h1>
            <nav>
                <a href="home.html">首页</a>
                <a href="visitor_view.html">实时统计</a>
                <a href="g_loginmode.html" class="active">群管登录</a>
                <a href="a_login.html">管理员</a>
                <button id="theme-toggle" onclick="toggleTheme()">🌙</button>
            </nav>
        </header>
        
        <main>
            <!-- 步骤 1: 输入群号获取验证码 -->
            <section id="step1" class="status" style="max-width: 500px; margin: 50px auto;">
                <div class="step-indicator">
                    <div class="step active"><span class="step-num">1</span><span>验证身份</span></div>
                    <div class="step"><span class="step-num">2</span><span>设置账号</span></div>
                </div>
                
                <h2>验证群管理员身份</h2>
                
                <form id="groupForm" style="margin-top: 30px;">
                    <div class="form-group">
                        <label for="group_id">群号</label>
                        <input type="text" id="group_id" name="group_id" placeholder="请输入你管理的群号" required pattern="[0-9]+" />
                    </div>
                    
                    <div id="error-msg" class="alert" style="display: none;"></div>
                    
                    <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 20px;">
                        获取验证码
                    </button>
                </form>
                
                <p style="margin-top: 20px; font-size: 0.9em; opacity: 0.7;">
                    <a href="g_loginmode.html">← 返回</a>
                </p>
            </section>
            
            <!-- 步骤 1.5: 显示验证码等待验证 -->
            <section id="step1_5" class="status" style="max-width: 500px; margin: 50px auto; display: none;">
                <div class="step-indicator">
                    <div class="step active"><span class="step-num">1</span><span>验证身份</span></div>
                    <div class="step"><span class="step-num">2</span><span>设置账号</span></div>
                </div>
                
                <h2>私聊机器人验证</h2>
                <p style="opacity: 0.8;">群号: <strong id="display-group"></strong></p>
                
                <div class="verify-code" id="display-code">------</div>
                
                <div class="waiting-indicator" id="waiting">
                    <div class="spinner"></div>
                    <span>等待验证中...</span>
                </div>
                
                <div class="countdown" id="countdown">验证码有效期: <span id="time-left">5:00</span></div>
                
                <ol style="text-align: left; margin-top: 25px; padding: 20px; background: var(--input-bg); border-radius: 8px;">
                    <li style="margin-bottom: 10px;"><strong>复制上方验证码</strong></li>
                    <li style="margin-bottom: 10px;"><strong>私聊</strong>机器人，发送验证码（直接发数字）</li>
                    <li style="margin-bottom: 10px;">机器人会检查你是否为该群管理员</li>
                    <li>验证通过后自动进入下一步</li>
                </ol>
                
                <p style="margin-top: 20px; font-size: 0.9em;">
                    <a href="#" onclick="location.reload()">← 重新输入群号</a>
                </p>
            </section>
            
            <!-- 步骤 2: 设置账号密码 -->
            <section id="step2" class="status" style="max-width: 500px; margin: 50px auto; display: none;">
                <div class="step-indicator">
                    <div class="step"><span class="step-num">✓</span><span>验证身份</span></div>
                    <div class="step active"><span class="step-num">2</span><span>设置账号</span></div>
                </div>
                
                <h2>设置账号密码</h2>
                <p style="margin-bottom: 20px; opacity: 0.8;">验证成功！请设置你的登录账号</p>
                
                <form id="registerForm" style="margin-top: 30px;">
                    <div class="form-group">
                        <label for="username">用户名</label>
                        <input type="text" id="username" name="username" placeholder="设置用户名（3-20字符）" required minlength="3" maxlength="20" />
                    </div>
                    
                    <div class="form-group">
                        <label for="password">密码</label>
                        <input type="password" id="password" name="password" placeholder="设置密码（6位以上）" required minlength="6" />
                    </div>
                    
                    <div class="form-group">
                        <label for="password2">确认密码</label>
                        <input type="password" id="password2" name="password2" placeholder="再次输入密码" required />
                    </div>
                    
                    <div id="register-error" class="alert" style="display: none;"></div>
                    
                    <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 20px;">
                        完成注册
                    </button>
                </form>
            </section>
        </main>
        
        <footer>
            <p>QQ Bot &copy; 2026</p>
        </footer>
    </div>
    
    <script>
        function toggleTheme() {
            const link = document.getElementById('theme-style');
            const btn = document.getElementById('theme-toggle');
            if (link.href.includes('light.css')) {
                link.href = 'css/dark.css';
                btn.textContent = '☀️';
                localStorage.setItem('theme', 'dark');
            } else {
                link.href = 'css/light.css';
                btn.textContent = '🌙';
                localStorage.setItem('theme', 'light');
            }
        }
        
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') {
            document.getElementById('theme-style').href = 'css/dark.css';
            document.getElementById('theme-toggle').textContent = '☀️';
        }
        
        let currentCode = null;
        let currentGroupId = null;
        let tempToken = null;
        let pollInterval = null;
        let countdownInterval = null;
        let expireTime = null;
        
        // 步骤 1: 获取验证码
        document.getElementById('groupForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const groupId = document.getElementById('group_id').value.trim();
            const errorDiv = document.getElementById('error-msg');
            
            if (!/^\d+$/.test(groupId)) {
                errorDiv.textContent = '请输入有效的群号（纯数字）';
                errorDiv.style.display = 'block';
                return;
            }
            
            try {
                const resp = await fetch('/api/auth/gen-code', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ group_id: parseInt(groupId) })
                });
                
                const data = await resp.json();
                
                if (data.code) {
                    currentCode = data.code;
                    currentGroupId = groupId;
                    document.getElementById('display-group').textContent = groupId;
                    document.getElementById('display-code').textContent = data.code;
                    document.getElementById('step1').style.display = 'none';
                    document.getElementById('step1_5').style.display = 'block';
                    
                    // 倒计时
                    expireTime = Date.now() + 5 * 60 * 1000;
                    updateCountdown();
                    countdownInterval = setInterval(updateCountdown, 1000);
                    
                    // 轮询
                    startPolling();
                } else {
                    errorDiv.textContent = data.message || '获取验证码失败';
                    errorDiv.style.display = 'block';
                }
            } catch (err) {
                errorDiv.textContent = '网络错误，请稍后重试';
                errorDiv.style.display = 'block';
            }
        });
        
        function updateCountdown() {
            const remaining = Math.max(0, expireTime - Date.now());
            const minutes = Math.floor(remaining / 60000);
            const seconds = Math.floor((remaining % 60000) / 1000);
            document.getElementById('time-left').textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
            
            if (remaining <= 0) {
                clearInterval(countdownInterval);
                clearInterval(pollInterval);
                alert('验证码已过期，请重新获取');
                location.reload();
            }
        }
        
        function startPolling() {
            pollInterval = setInterval(async () => {
                try {
                    const resp = await fetch(`/api/auth/check-status?code=${currentCode}`);
                    const data = await resp.json();
                    
                    if (data.access_token) {
                        // 验证成功！保存临时 token，进入步骤 2
                        clearInterval(pollInterval);
                        clearInterval(countdownInterval);
                        
                        tempToken = data.access_token;
                        
                        document.getElementById('step1_5').style.display = 'none';
                        document.getElementById('step2').style.display = 'block';
                    }
                } catch (err) {
                    // 忽略
                }
            }, 2000);
        }
        
        // 步骤 2: 注册账号
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const password2 = document.getElementById('password2').value;
            const errorDiv = document.getElementById('register-error');
            
            errorDiv.style.display = 'none';
            
            if (password !== password2) {
                errorDiv.textContent = '两次输入的密码不一致';
                errorDiv.style.display = 'block';
                return;
            }
            
            try {
                const resp = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + tempToken
                    },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await resp.json();
                
                if (data.access_token) {
                    localStorage.setItem('token', data.access_token);
                    localStorage.setItem('role', data.role);
                    alert('注册成功！');
                    window.location.href = 'groups.html';
                } else {
                    errorDiv.textContent = data.detail || data.message || '注册失败';
                    errorDiv.style.display = 'block';
                }
            } catch (err) {
                errorDiv.textContent = '网络错误，请稍后重试';
                errorDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
